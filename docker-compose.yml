# The whole app: `docker compose up -d --build`, then open http://localhost:8080.
# Without a .env file (see .env.example) the backend uses mock plugs and never touches real ones.

# Keep at most 30 MB of logs per container: by default they grow without limit.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  backend:
    build: ./backend
    restart: unless-stopped
    logging: *logging
    env_file:
      - path: .env
        required: false
    # These win over .env: the paths must match the volumes below.
    environment:
      DATABASE_URL: sqlite+aiosqlite:////srv/data/tapo.db
      CONFIG_DIR: /srv/config
      # Only the tunnel needs this secret from .env.
      TUNNEL_TOKEN: ""
    volumes:
      # Tariffs, holidays and plugs: edit and restart, no rebuild needed.
      - ./config:/srv/config:ro
      # The database. On Linux this folder must be writable by user 1000.
      - ./data:/srv/data
    # Time to stop cleanly before Docker kills the process.
    stop_grace_period: 10s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_TIMEZONE: ${TIMEZONE:-America/Montevideo}
    restart: unless-stopped
    logging: *logging
    # The only published port: the API is reachable through it, under /api.
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    depends_on:
      - backend
    # Stop at once. The image's default waits for open connections, and a live stream never ends;
    # nginx stores nothing, so there is nothing to finish.
    stop_signal: SIGTERM

  # Optional remote access through Cloudflare, started only with `--profile tunnel`. It connects
  # outwards, so the router needs no open port. The app has no login: protect the public address with
  # Cloudflare Access first, and point the tunnel to http://frontend:8080.
  cloudflared:
    profiles: ["tunnel"]
    image: cloudflare/cloudflared:2026.11.2
    restart: unless-stopped
    logging: *logging
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      - frontend
