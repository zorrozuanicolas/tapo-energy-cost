server {
    listen 8080;
    root /usr/share/nginx/html;

    # The API, including the live stream: the backend asks nginx not to buffer it (X-Accel-Buffering)
    # and sends something every 15 s, well within nginx's 60 s read timeout.
    location /api/ {
        # Look the name up again while running, with Docker's internal DNS server: otherwise a
        # recreated backend container with a new address would give 502 until nginx restarted.
        resolver 127.0.0.11 valid=10s;
        set $backend http://backend:8000;
        proxy_pass $backend;
        proxy_http_version 1.1;
    }

    # Vite puts a hash of the content in these file names, so a cached copy is never out of date.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html names the current assets: the browser must check for a new one each time.
    location / {
        add_header Cache-Control "no-cache";
    }
}
